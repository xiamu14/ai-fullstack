[project]
name = "coder-cli"
version = "0.1.0"
description = "A minimal coding agent for learning the agent loop"
readme = "README.md"
authors = [
    { name = "xiazhigang@yev.com", email = "xiazhigang@yev.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "httpx[socks]>=0.28.1",
    "httpx2>=2.16.0",
    "logfire>=5.4.0",
    "playwright>=1.64.1",
    "pydantic-ai>=2.64.0",
    "pydantic-ai-harness[coder,skills]",
    "pydantic-ai-slim[openai]",
    "python-dotenv",
    "textual>=8.2.8",
]

[tool.uv.workspace]
members = [
    "example/hello",
]
