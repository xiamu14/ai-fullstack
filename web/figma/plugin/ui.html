<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Figma 本地连接</title>
    <link id="plugin-styles" rel="stylesheet" href="/src/styles.css">
  </head>
  <body class="m-0 bg-[var(--figma-color-bg,#2c2c2c)] px-3.5 py-3 font-sans text-xs leading-normal text-[var(--figma-color-text,#e6e6e6)]">
    <main class="flex flex-col gap-2">
      <div class="flex items-center gap-2 font-semibold">
        <span id="dot" aria-hidden="true" class="size-2 shrink-0 rounded-full bg-warning-500"></span>
        <span id="status">等待配对</span>
      </div>
      <form id="pairing" class="flex flex-col gap-1.5">
        <label for="token">配对码</label>
        <div class="flex gap-2">
          <input id="token" name="token" type="text" maxlength="6" autocomplete="off" spellcheck="false" required pattern="[A-Za-z0-9]{6}" aria-describedby="pairing-help" class="min-w-0 flex-1 rounded border border-current/40 px-2 py-1 text-xs focus-visible:outline-2 focus-visible:outline-offset-2">
          <button type="submit" class="min-h-6 rounded border border-current/40 px-2 py-1 focus-visible:outline-2 focus-visible:outline-offset-2">连接</button>
        </div>
        <p id="pairing-help" class="text-[0.6875rem]">运行 <code>bun figma/cli.ts pair</code> 获取</p>
      </form>
      <p id="meta" class="break-all text-[0.6875rem] text-[var(--figma-color-text-secondary,#a3a3a3)]">仅连接本机，只读访问</p>
      <span id="announcements" role="status" aria-atomic="true" class="sr-only"></span>
    </main>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
